
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <style>
      .color-blue { fill: #115886; }
      .color-orange { fill: #F06A35; }
      .logo-text { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        font-size: 80px; 
        font-weight: 700; 
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <!-- Icône de gauche : Le "S" stylisé -->
  <!-- Courbe bleue supérieure -->
  <path class="color-blue" d="M130,80 C70,90 20,40 100,15 C50,10 5,45 30,95 C55,135 110,100 130,80 Z" />
  
  <!-- Point central orange -->
  <circle class="color-orange" cx="95" cy="58" r="9" />
  
  <!-- Courbe orange inférieure -->
  <path class="color-orange" d="M45,145 C110,145 150,90 115,65 C145,80 150,130 105,155 C80,165 60,155 45,145 Z" />

  <!-- Texte du logo -->
  <text x="170" y="110" class="color-blue logo-text">SajArt</text>

  <!-- Détail du Pinceau sur le "j" -->
  <path class="color-blue" d="M 285,60 L 305,20 L 312,25 L 295,70 Z" />
  <path class="color-orange" d="M 285,60 C 280,65 290,80 295,70 Z" />
</svg>


